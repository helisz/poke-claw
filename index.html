<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>宝可梦 · 抓娃娃</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="hud">
        <span class="chip">剩余 <b id="hud-tries">8</b> 次</span>
        <span class="chip">抓到 <b id="hud-caught">0</b> 只</span>
      </header>

      <div id="stage"><div id="game"></div></div>

      <footer id="controls">
        <div class="dpad">
          <button class="d" data-dir="left" aria-label="左">◀</button>
          <button class="d" data-dir="right" aria-label="右">▶</button>
        </div>
        <button id="action-btn">下 爪</button>
      </footer>

      <div id="card-overlay"></div>
      <div id="toast"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
